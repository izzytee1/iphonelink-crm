name: Verify React Build
on:
  push:
    branches: [main, v05-desktop-mobile, v06-dark-call-banner, v07-iphone-polish, v08-native-visuals, v09-compact-ui, v10-instant-communications, v11-native-premium]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Focused desktop check
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/iphonelink-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          node scripts/test-v12-desktop.mjs
