name: Import verified iPhoneLink v02
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-v02.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Unpack verified v02 source
        shell: bash
        run: |
          set -euo pipefail
          archive='iPhoneLink-React-v02 2.zip'
          test "$(git hash-object "$archive")" = '86f52b2b57fc05ba483da533299729a11cb50a47'
          unzip -q "$archive" -d "$RUNNER_TEMP/iphonelink-v02"
          cp -R "$RUNNER_TEMP/iphonelink-v02/iPhoneLink-React-v02/." .
          test -f package.json
          test -f src/App.jsx
          node scripts/verify-source.mjs
          node scripts/test-iphonelink-v02.mjs
      - name: Commit original v02 source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md FEATURES.md TEST_REPORT.md index.html package.json postcss.config.js tailwind.config.js vite.config.js scripts src
          if ! git diff --cached --quiet; then
            git commit -m 'Import verified iPhoneLink v02 React source'
            git push origin HEAD:main
          fi
